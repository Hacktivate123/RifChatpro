<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RifChatPro</title>
<style>
  :root{ --sea-deep:#0F3B52; --sea:#1B6A8C; --wash:#E7F4FA; --clay:#D98E4A; --ink:#0F2537; --paper:#FBFDFE; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--wash);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;display:flex;flex-direction:column;}
  header{background:linear-gradient(180deg,var(--sea-deep),var(--sea));color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  header h1{margin:0;font-size:20px;}
  header p{margin:4px 0 0;font-size:12px;color:#CFEAF5;}
  #gate{position:fixed;inset:0;background:var(--sea-deep);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20;}
  #gate .card{background:var(--paper);border-radius:18px;padding:24px;max-width:340px;width:100%;text-align:center;}
  #gate h2{margin:0 0 6px;color:var(--ink);}
  #gate p{color:var(--sea);font-size:13px;margin:0 0 14px;line-height:1.6;}
  #gate label{display:block;text-align:right;font-size:12px;color:var(--sea);margin:8px 0 4px;}
  #gate input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(15,106,140,.3);font-size:15px;background:var(--wash);color:var(--ink);}
  #gate button,#bar button{background:var(--clay);color:#fff;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:15px;width:100%;margin-top:14px;cursor:pointer;}
  #gate .status{font-size:12px;margin-top:10px;color:var(--sea);}
  #room{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;}
  .msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.5;word-wrap:break-word;}
  .msg .nm{display:block;font-size:12px;font-weight:700;margin-bottom:2px;}
  .mine{align-self:flex-start;background:var(--sea);color:#fff;border-bottom-left-radius:4px;}
  .mine .nm{color:#CFEAF5;}
  .other{align-self:flex-end;background:var(--paper);border:1px solid rgba(15,106,140,.15);border-bottom-right-radius:4px;}
  .other .nm{color:var(--sea);}
  .sys{align-self:center;color:var(--sea);font-size:12px;opacity:.8;}
  form#bar{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid rgba(15,106,140,.15);}
  #msgInput{flex:1;border:1px solid rgba(15,106,140,.25);border-radius:22px;padding:11px 16px;font-size:15px;background:var(--wash);color:var(--ink);}
  #bar button{width:auto;margin:0;border-radius:22px;padding:0 18px;}
  #users{font-size:12px;color:#CFEAF5;margin-top:6px;}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>RifChatPro</h2>
    <p>أدخل اسمك وعنوان الخادم، ثم ادخل الدردشة.</p>
    <label>اسمك</label>
    <input id="nameInput" maxlength="20" placeholder="اسمك">
    <label>عنوان الخادم</label>
    <input id="serverInput" value="http://10.49.240.128:3000" dir="ltr">
    <button id="joinBtn">دخول</button>
    <div class="status" id="gateStatus"></div>
  </div>
</div>

<header>
  <h1>RifChatPro</h1>
  <p id="headerSub">دردشة جماعية</p>
  <div id="users"></div>
</header>

<div id="room"></div>

<form id="bar">
  <input id="msgInput" maxlength="500" placeholder="اكتب رسالة..." autocomplete="off">
  <button type="submit">إرسال</button>
</form>

<script>
  const gate = document.getElementById('gate');
  const nameInput = document.getElementById('nameInput');
  const serverInput = document.getElementById('serverInput');
  const joinBtn = document.getElementById('joinBtn');
  const gateStatus = document.getElementById('gateStatus');
  const room = document.getElementById('room');
  const bar = document.getElementById('bar');
  const msgInput = document.getElementById('msgInput');
  const usersEl = document.getElementById('users');

  let socket = null;
  let myName = '';

  function addMsg(name, text, type) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    if (type !== 'sys') {
      const n = document.createElement('span');
      n.className = 'nm';
      n.textContent = name;
      div.appendChild(n);
    }
    const t = document.createElement('span');
    t.textContent = text;
    div.appendChild(t);
    room.appendChild(div);
    room.scrollTop = room.scrollHeight;
  }

  function connect(server) {
    const script = document.createElement('script');
    script.src = server + '/socket.io/socket.io.js';
    script.onload = () => {
      socket = io(server, { transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        gateStatus.textContent = 'متصل بالخادم';
        socket.emit('user joined', myName);
      });

      socket.on('connect_error', () => {
        gateStatus.textContent = 'تعذر الاتصال بالخادم. تأكد من العنوان والشبكة.';
      });

      socket.on('chat history', (rows) => {
        rows.forEach(r => addMsg(r.name, r.text, r.name === myName ? 'mine' : 'other'));
      });

      socket.on('chat message', (m) => {
        addMsg(m.name, m.text, m.name === myName ? 'mine' : 'other');
      });

      socket.on('update users', (users) => {
        usersEl.textContent = 'المتصلون: ' + users.join('، ');
      });

      gate.style.display = 'none';
      msgInput.focus();
    };
    script.onerror = () => {
      gateStatus.textContent = 'تعذر تحميل الخادم. تأكد أن الهاتف على نفس الشبكة.';
    };
    document.head.appendChild(script);
  }

  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    let server = serverInput.value.trim().replace(/\/+$/, '');
    if (!name) { gateStatus.textContent = 'اكتب اسمك أولًا'; return; }
    if (!server) { gateStatus.textContent = 'اكتب عنوان الخادم'; return; }
    myName = name;
    gateStatus.textContent = 'جاري الاتصال...';
    connect(server);
  });

  bar.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text || !socket || !socket.connected) return;
    socket.emit('chat message', { name: myName, text: text });
    msgInput.value = '';
  });
</script>
</body>
</html>
