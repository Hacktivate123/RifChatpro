<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RifChatPro</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F3B52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#0F3B52; --sea:#1B6A8C; --chaouen:#5FB3D9;
    --wash:#E7F4FA; --clay:#D98E4A; --ink:#0F2537; --paper:#FBFDFE;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --wash:#102A38; --paper:#0C212C; --ink:#EAF4F9; --sea-deep:#081F2C; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{ background: var(--wash); color: var(--ink); font-family:'Tajawal',sans-serif; display:flex; flex-direction:column; overflow: hidden; }
  
  /* Header & Sidebar */
  header{ background: linear-gradient(180deg, var(--sea-deep), var(--sea)); color:#fff; padding: 18px 20px 22px; position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: flex-start; }
  header h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size: clamp(22px,6vw,30px); margin:0 0 4px; }
  header p{ margin:0; font-size:14px; color:#CFEAF5; max-width:40ch; line-height:1.5; }
  #status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#CFEAF5; margin-top:8px; }
  #status .dot{ width:8px; height:8px; border-radius:50%; background:#6FCF97; }
  
  #menuBtn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  #menuBtn:hover { background: rgba(255,255,255,0.3); }

  /* Sidebar */
  #sidebar { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: var(--sea-deep); color: white; z-index: 200; transition: 0.3s; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
  #sidebar.open { left: 0; }
  #sidebar h3 { margin-top: 0; border-bottom: 1px solid var(--sea); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  #closeSidebar { cursor: pointer; font-size: 24px; }
  #usersList { list-style: none; padding: 0; overflow-y: auto; }
  #usersList li { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
  #usersList li::before { content: "●"; color: #6FCF97; font-size: 12px; }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
  #overlay.open { display: block; }

  /* Chat Room */
  #room{ flex:1; overflow-y:auto; padding: 22px 16px 10px; display:flex; flex-direction:column; gap:10px; max-width:720px; width:100%; margin:0 auto; }
  .msg{ max-width:78%; padding:10px 14px; border-radius:16px; line-height:1.5; font-size:15px; box-shadow:0 1px 2px rgba(15,37,55,.08); word-wrap:break-word; }
  .msg .name{ font-size:12px; font-weight:700; color: var(--sea); margin-bottom:2px; display:block; }
  .msg.mine{ align-self:flex-end; background: var(--sea); color:#fff; border-bottom-right-radius:4px; }
  .msg.mine .name{ color:#CFEAF5; }
  .msg.other{ align-self:flex-start; background: var(--paper); border:1px solid rgba(15,106,140,.15); border-bottom-left-radius:4px; }
  #empty{ margin:auto; text-align:center; color:var(--sea); opacity:.7; font-size:14px; padding:40px 20px; }

  /* Input Bar */
  form#bar{ display:flex; gap:8px; padding:10px 14px; background: var(--paper); border-top:1px solid rgba(15,106,140,.15); max-width:720px; width:100%; margin:0 auto; }
  #bar input{ flex:1; border:1px solid rgba(15,106,140,.25); border-radius:22px; padding:11px 16px; font-size:15px; font-family:inherit; background:var(--wash); color:var(--ink); }
  #bar button{ background: var(--clay); color:#fff; border:none; border-radius:22px; padding:0 20px; font-weight:700; font-size:15px; font-family:inherit; cursor:pointer; }

  /* Gate */
  #gate{ position:fixed; inset:0; background: var(--sea-deep); display:flex; align-items:center; justify-content:center; z-index:20; padding:24px; }
  #gate .card{ background: var(--paper); border-radius:18px; padding:28px 24px; max-width:340px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.3); }
  #gate h2{ font-family:'Space Grotesk',sans-serif; margin:0 0 6px; color:var(--ink); font-size:22px; }
  #gate p{ color:var(--sea); font-size:14px; margin:0 0 18px; line-height:1.5; }
  #gate input{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(15,106,140,.3); font-size:15px; font-family:inherit; margin-bottom:12px; background:var(--wash); color:var(--ink); }
  #gate button{ width:100%; background: var(--clay); color:#fff; border:none; border-radius:12px; padding:12px; font-weight:700; font-size:15px; cursor:pointer; }
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- Gate (Login) -->
<div id="gate">
  <div class="card">
    <h2>RifChatPro</h2>
    <p>Real-time group chat — your messages reach anyone who opens this page.</p>
    <input id="nameInput" type="text" placeholder="Your Name" maxlength="20" autocomplete="off">
    <button id="joinBtn">Join Room</button>
    <p class="small" id="gateStatus">Ready to connect...</p>
  </div>
</div>

<!-- Sidebar (Online Users) -->
<div id="overlay" onclick="toggleSidebar()"></div>
<div id="sidebar">
  <h3>Online Users <span id="closeSidebar" onclick="toggleSidebar()">×</span></h3>
  <ul id="usersList"></ul>
</div>

<!-- Main App -->
<header>
  <div>
    <h1>RifChatPro</h1>
    <p>Group Chat — Connected across devices</p>
    <div id="status" class="offline"><span class="dot"></span><span id="statusText">Connecting...</span></div>
  </div>
  <button id="menuBtn" onclick="toggleSidebar()">☰</button>
</header>

<div id="room"><div id="empty">No messages yet. Be the first to say hi 👋</div></div>

<form id="bar">
  <input id="msgInput" type="text" placeholder="Type a message..." maxlength="500" autocomplete="off" disabled>
  <button type="submit" disabled>Send</button>
</form>

<script>
  const socket = io(); 
  
  const gate = document.getElementById('gate');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const gateStatus = document.getElementById('gateStatus');
  const room = document.getElementById('room');
  const empty = document.getElementById('empty');
  const bar = document.getElementById('bar');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = bar.querySelector('button');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');

  let myName = '';

  // Sidebar Logic
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
  }

  socket.on('connect', () => {
    statusEl.classList.remove('offline');
    statusText.textContent = 'Online — Messages synced';
    gateStatus.textContent = 'Server ready. Enter your name.';
  });

  socket.on('disconnect', () => {
    statusEl.classList.add('offline');
    statusText.textContent = 'Disconnected from server';
  });

  // Receive Online Users List
  socket.on('update users', (users) => {
    const list = document.getElementById('usersList');
    list.innerHTML = '';
    users.forEach(user => {
      const li = document.createElement('li');
      li.textContent = user;
      list.appendChild(li);
    });
  });

  socket.on('chat history', (messages) => {
    messages.forEach(msg => {
      addMessage(msg.name, msg.text, msg.name === myName ? 'mine' : 'other');
    });
  });

  socket.on('chat message', (msg) => {
    addMessage(msg.name, msg.text, msg.name === myName ? 'mine' : 'other');
  });

  function addMessage(name, text, type){
    if(empty && empty.parentNode) empty.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    if(type !== 'system'){
      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = name;
      div.appendChild(n);
    }
    const t = document.createElement('span');
    t.textContent = text;
    div.appendChild(t);
    room.appendChild(div);
    room.scrollTop = room.scrollHeight;
  }

  function join(){
    const v = nameInput.value.trim();
    if(!v) { nameInput.focus(); return; }
    myName = v;
    gate.style.display = 'none';
    msgInput.disabled = false;
    sendBtn.disabled = false;
    msgInput.focus();
    socket.emit('user joined', myName); // إرسال الاسم للسيرفر
  }

  joinBtn.addEventListener('click', join);
  nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') join(); });

  bar.addEventListener('submit', function(e){
    e.preventDefault();
    const text = msgInput.value.trim();
    if(!text) return;
    socket.emit('chat message', { name: myName, text: text });
    msgInput.value = '';
  });

</script>
</body>
</html>
